<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Security: a production CSP is injected here by scripts/security/postbuild-csp.js
         (dev mode needs eval/inline for hot reload, so it is not set in this file). -->
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Iron Realm" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="RPG Gym Tracker — level up your body" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/icons/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icons/icon-192.png" />

    <!-- Rajdhani is self-hosted: no request leaves the app for a font, and the
         app renders offline and under a strict CSP. -->
    <link rel="preload" href="%PUBLIC_URL%/fonts/rajdhani-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="%PUBLIC_URL%/fonts/rajdhani.css" />

    <title>Iron Realm</title>

    <style>
      /* Prevent pull-to-refresh and overscroll on Android */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: #000000;
        overscroll-behavior: none;
        overflow: hidden;
        height: 100%;
        width: 100%;
      }
      #root {
        height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <noscript>Iron Realm needs JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
